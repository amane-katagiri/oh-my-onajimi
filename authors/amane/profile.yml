note: >-
  初版。onajimi profile（記事 tech/ugoki のプロファイル用 64 本 と、同じ見出しで書かせた opus/gemini 各 64 本）の結果から人が選んだ。
  evidence の数はプロファイル用の記事での出現数。筆者の記事でほぼ使われず、両方のモデルが使う語だけを model_leaning にした。
  ふと・思わず・推奨などは記事では使わないが小説（lily）では使うので、このプロファイルは記事専用。
  対照の指示に ai_summary を渡しているので、ai_summary に出る語（試み など）は対照側に写り込んでいる恐れがあり、入れていない。

model_leaning:
  - tokens:
      - basic_form: た
      - basic_form: 瞬間
    message: 「〜た瞬間」は筆者の記事では使わない。時間の前後関係をそのまま書く。
    evidence:
      author: 1
      opus: 26
      gemini: 70
  - tokens:
      - basic_form: ふと
    message: 「ふと」は筆者の記事では使わない。消すか、きっかけを書く。
    evidence:
      author: 1
      opus: 9
      gemini: 14
  - tokens:
      - basic_form: 思わず
    message: 「思わず」は筆者の記事では使わない。消すか、具体的な反応を書く。
    evidence:
      author: 1
      opus: 8
      gemini: 14
  - tokens:
      - basic_form: どこ
      - basic_form: か
    message: 「どこか」は筆者の記事ではほぼ使わない。場所なら具体的に書き、ぼかしなら消す。
    evidence:
      author: 2
      opus: 46
      gemini: 55

author_leaning:
  - tokens:
      - basic_form: 大切
    author: 重要
    message: 筆者の記事では「大切」は少なく「重要」が多い。「大切にする」のように言い換えられない所はそのままでよい。
    evidence:
      author: 1
      author_alternative: 30
      opus: 23
      gemini: 13
  - tokens:
      - basic_form: 推奨
    author: おすすめ
    evidence:
      author: 2
      author_alternative: 35
      opus: 8
      gemini: 15

orthography:
  - expected: 全て
    pattern: すべて
  - expected: 分か
    pattern: /わか(?=[らりるれろっ])/
  - expected: 気付
    pattern: 気づ
  - expected: 様々
    pattern: さまざま

thresholds:
  sentence_length: 253
  max_ten: 6
  bold_per_1000: 4
  list_ratio: 0.46

allow: []
